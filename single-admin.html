<!DOCTYPE html>
<!-- ✂️ این فایل به‌صورت خودکار از admin.html ساخته شده است (نسخه‌ی تک‌فایلی).
     بدون نیاز به سرور؛ فقط روی فایل دوبار کلیک کنید.
     برای ساخت مجدد: python3 tools/build-single.py -->

<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>پنل مدیریت فروشگاه</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e9f6e">
  <style>
/* ============================================================
   Shop Manager — استایل اصلی (راست‌به‌چپ، ریسپانسیو، مدرن)
   بخش‌ها: ۱) متغیرها و پایه  ۲) اجزای عمومی  ۳) پنل مدیریت
            ۴) فروشگاه مشتری  ۵) چاپ
   ============================================================ */

/* ---------- ۱) متغیرها و پایه ---------- */
:root {
  --primary: #0e9f6e;
  --primary-dark: #0a7a54;
  --primary-soft: #e6f7f1;
  --accent: #f59e0b;
  --danger: #e02424;
  --info: #2563eb;
  --warn: #d97706;
  --bg: #f4f7f6;
  --card: #ffffff;
  --text: #14231f;
  --muted: #6b7c78;
  --line: #e3ebe8;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 26px rgba(17, 45, 38, .07);
  --shadow-lg: 0 18px 44px rgba(17, 45, 38, .13);
  --font: "Vazirmatn", "IRANSans", "Segoe UI", Tahoma, system-ui, sans-serif;
  --header-h: 62px;
}
[data-theme="ocean"] { --primary:#0a7ea4; --primary-dark:#075c79; --primary-soft:#e5f4fa; --accent:#f97316; }
[data-theme="grape"] { --primary:#7c3aed; --primary-dark:#5b21b6; --primary-soft:#f2ecff; --accent:#ec4899; }
[data-theme="sunset"] { --primary:#e11d48; --primary-dark:#a30f36; --primary-soft:#ffe9ee; --accent:#f59e0b; }
[data-theme="night"] {
  --primary:#34d399; --primary-dark:#059669; --primary-soft:#0f2a23;
  --bg:#0e1512; --card:#151f1b; --text:#e8f2ee; --muted:#93a49f; --line:#233029;
  --shadow: 0 8px 26px rgba(0,0,0,.45); --shadow-lg: 0 18px 44px rgba(0,0,0,.55);
}
[data-theme="night"] .topbar, [data-theme="night"] .prod-thumb { background:#101a16; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  direction: rtl; line-height: 1.75; font-size: 15px;
  -webkit-tap-highlight-color: transparent;
}
body.no-scroll { overflow: hidden; }
a { color: var(--primary); text-decoration: none; }
h1, h2, h3, h4 { margin: 0 0 .4em; line-height: 1.5; font-weight: 700; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
img { max-width: 100%; display: block; }
svg { fill: currentColor; }
.hidden { display: none !important; }
.ico { display: inline-flex; align-items: center; justify-content: center; vertical-align: -3px; }
.ico svg { width: 1em; height: 1em; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.center { text-align: center; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.wrap { flex-wrap: wrap; }
.gap-xs { gap: 6px; } .gap-sm { gap: 10px; } .gap { gap: 16px; } .gap-lg { gap: 24px; }
.between { justify-content: space-between; }
.bold { font-weight: 700; }
.mt { margin-top: 16px; } .mt-sm { margin-top: 8px; } .mb { margin-bottom: 16px; }
.nowrap { white-space: nowrap; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- ۲) اجزای عمومی ---------- */
.container { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px;
}
.card.tight { padding: 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.card-head h3 { margin: 0; display: flex; align-items: center; gap: 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: 1px solid transparent; background: var(--primary-soft); color: var(--primary-dark);
  padding: 9px 15px; border-radius: 12px; cursor: pointer; font: inherit; font-weight: 600;
  transition: transform .12s ease, box-shadow .12s ease, background .15s;
  white-space: nowrap; min-height: 40px;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-accent { background: var(--accent); color: #3a2a05; }
.btn-danger { background: #fde8e8; color: var(--danger); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--text); }
.btn-outline { background: transparent; border-color: var(--primary); color: var(--primary); }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 11px; min-height: 34px; font-size: .88rem; border-radius: 10px; }
.btn-lg { padding: 13px 22px; min-height: 50px; font-size: 1.02rem; border-radius: 14px; }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.icon-btn {
  background: transparent; border: 1px solid var(--line); border-radius: 10px;
  width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--muted); font-size: 1rem; flex: 0 0 auto;
}
.icon-btn:hover { color: var(--primary); border-color: var(--primary); }
.icon-btn.round { border-radius: 50%; }

.input, select.input, textarea.input {
  width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--text); font: inherit; min-height: 42px;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.input-sm { padding: 6px 10px; min-height: 34px; font-size: .88rem; border-radius: 10px; }
.input-lg { padding: 13px 16px; min-height: 52px; font-size: 1.05rem; }
textarea.input { resize: vertical; min-height: 80px; line-height: 1.7; }
.lbl { display: block; font-size: .86rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
.hint { cursor: help; color: var(--primary); }
.field { margin-bottom: 12px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.form-grid .field.full { grid-column: 1 / -1; }
@media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }

.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; }
.switch input { display: none; }
.switch .slider {
  width: 42px; height: 24px; background: #cfd8d5; border-radius: 20px; position: relative; transition: background .2s; flex: 0 0 auto;
}
.switch .slider::after {
  content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff;
  top: 3px; right: 3px; transition: right .2s;
}
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider::after { right: 21px; }
.switch-lbl { font-size: .9rem; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); cursor: pointer; font: inherit; font-size: .87rem;
  color: var(--text); transition: all .15s;
}
.chip:hover { border-color: var(--primary); color: var(--primary); }
.chip.active, .chip.chip-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.chip b { font-weight: 700; opacity: .85; font-size: .8rem; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
.pill-ok { background: #e6f7f1; color: #067a55; }
.pill-warn { background: #fff4e0; color: #a35a00; }
.pill-err { background: #fde8e8; color: #b91c1c; }
.pill-info { background: #e8f0fe; color: #1d4ed8; }
.pill-muted { background: #eef2f1; color: #5b6b67; }
[data-theme="night"] .pill-ok { background: #0d3327; color: #6ee7b7; }
[data-theme="night"] .pill-warn { background: #3a2a08; color: #fcd34d; }
[data-theme="night"] .pill-err { background: #3d1414; color: #fca5a5; }
[data-theme="night"] .pill-info { background: #12244a; color: #93c5fd; }
[data-theme="night"] .pill-muted { background: #1d2825; color: #9fb3ae; }

.alert { padding: 11px 14px; border-radius: 12px; margin: 8px 0; border: 1px solid transparent; font-size: .92rem; }
.alert-info { background: #eef4ff; border-color: #cfe0ff; color: #1e40af; }
.alert-ok { background: #e9f9f2; border-color: #bfeeda; color: #066e4e; }
.alert-warn { background: #fff8e6; border-color: #ffe2a8; color: #92500a; }
.alert-err { background: #fdecec; border-color: #f8c9c9; color: #a71818; }
[data-theme="night"] .alert-info { background: #10203f; border-color: #1e3a63; color: #a8c8ff; }
[data-theme="night"] .alert-ok { background: #0d2b21; border-color: #14523c; color: #86efac; }
[data-theme="night"] .alert-warn { background: #33260a; border-color: #5b4310; color: #fcd34d; }
[data-theme="night"] .alert-err { background: #3a1414; border-color: #5f2020; color: #fca5a5; }

/* جدول */
.table-wrap { overflow-x: auto; }
.table-tools { display: flex; align-items: center; gap: 10px; padding: 4px 0 10px; flex-wrap: wrap; }
.table { width: 100%; border-collapse: collapse; font-size: .92rem; min-width: 560px; }
.table th, .table td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table thead th { background: var(--primary-soft); color: var(--primary-dark); font-size: .85rem; position: sticky; top: 0; z-index: 2; }
.table th.sortable { cursor: pointer; user-select: none; }
.table th.sortable::after { content: '⇅'; opacity: .35; margin-inline-start: 5px; }
.table th.asc::after { content: '↑'; opacity: 1; }
.table th.desc::after { content: '↓'; opacity: 1; }
.table tbody tr:hover { background: var(--primary-soft); }
.table tbody tr { transition: background .12s; }
.pager { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 12px 0 2px; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; }
.empty-illustration { font-size: 2.4rem; display: block; margin-bottom: 8px; }
@media (max-width: 640px) {
  .table { min-width: 0; }
  .table thead { display: none; }
  .table tr { display: block; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; padding: 6px; background: var(--card); }
  .table td { display: flex; justify-content: space-between; gap: 10px; border: none; padding: 6px 8px; }
  .table td::before { content: attr(data-label); color: var(--muted); font-size: .8rem; }
}

/* آمار و نمودار */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 17px; box-shadow: var(--shadow); }
.stat-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; }
.stat-value { font-size: 1.5rem; font-weight: 800; margin-top: 6px; letter-spacing: -.5px; }
.stat-sub { font-size: .8rem; color: var(--muted); margin-top: 3px; }
.stat-primary { border-inline-start: 4px solid var(--primary); }
.stat-warn { border-inline-start: 4px solid var(--warn); }
.stat-err { border-inline-start: 4px solid var(--danger); }
.stat-info { border-inline-start: 4px solid var(--info); }
.chart-box { width: 100%; }
.chart { width: 100%; height: 210px; display: block; }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 92px; align-items: center; gap: 10px; font-size: .87rem; }
.bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { background: var(--line); border-radius: 999px; height: 12px; overflow: hidden; }
.bar-track i { display: block; height: 100%; border-radius: 999px; transition: width .5s ease; }
.bar-value { text-align: left; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .bar-row { grid-template-columns: 92px 1fr 72px; font-size: .8rem; } }
.donut-box { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut { width: 168px; height: 168px; flex: 0 0 auto; }
.donut-legend { flex: 1 1 200px; display: flex; flex-direction: column; gap: 7px; font-size: .88rem; }
.legend-row { display: flex; align-items: center; gap: 8px; }
.legend-row i { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }

/* توست و مودال */
.toasts { position: fixed; inset-block-end: 20px; inset-inline-start: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 9px; }
.toast {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 15px;
  box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 9px; max-width: 340px;
  opacity: 0; transform: translateY(14px); transition: all .25s ease; font-size: .9rem;
}
.toast.in { opacity: 1; transform: translateY(0); }
.toast-ico { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; color: #fff; flex: 0 0 auto; }
.toast-ok .toast-ico { background: var(--primary); }
.toast-err .toast-ico { background: var(--danger); }
.toast-warn .toast-ico { background: var(--warn); }
.toast-info .toast-ico { background: var(--info); }

.modal-back {
  position: fixed; inset: 0; background: rgba(10, 25, 20, .5); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 9000;
  opacity: 0; transition: opacity .2s;
}
.modal-back.in { opacity: 1; }
.modal {
  background: var(--card); border-radius: var(--radius); width: 100%; max-width: 560px;
  max-height: 92vh; overflow: auto; box-shadow: var(--shadow-lg); transform: scale(.97); transition: transform .2s;
}
.modal-back.in .modal { transform: scale(1); }
.modal-lg { max-width: 880px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 3; }
.modal-head h3 { margin: 0; }
.modal-body { padding: 16px 18px; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-start; position: sticky; bottom: 0; background: var(--card); }

/* انتخابگر تصویر و پنل هوشمند */
.img-picker { display: flex; flex-direction: column; gap: 10px; }
.img-preview {
  border: 2px dashed var(--line); border-radius: var(--radius); min-height: 168px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; background: var(--primary-soft);
  overflow: hidden; position: relative; text-align: center;
}
.img-preview.drag { border-color: var(--primary); background: #d8f5ea; }
.img-preview.has { border-style: solid; background: #fff; }
.img-preview img { width: 100%; max-height: 300px; object-fit: contain; }
.img-empty { color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px; font-size: .88rem; }
.ai-report { border: 1px solid var(--line); border-radius: var(--radius); padding: 13px; background: linear-gradient(180deg, var(--primary-soft), var(--card)); }
.ai-head { display: flex; align-items: center; gap: 7px; font-weight: 700; color: var(--primary-dark); margin-bottom: 9px; font-size: .93rem; }
.ai-chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }
.ai-summary { font-size: .87rem; color: var(--text); background: var(--card); border-radius: 10px; padding: 9px 11px; border: 1px solid var(--line); }
.ai-actions { margin-top: 9px; }
.ai-why { margin: 8px 0 0; padding-inline-start: 18px; font-size: .85rem; color: var(--muted); }
.palette { display: flex; align-items: center; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
.swatch { width: 22px; height: 22px; border-radius: 7px; border: 1px solid rgba(0,0,0,.12); display: inline-block; }

/* ماشین‌حساب قیمت */
.calc { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.calc-lbl { font-size: .82rem; color: var(--muted); }
.calc-display {
  font-size: 1.7rem; font-weight: 800; text-align: center; padding: 12px 8px; margin: 6px 0 10px;
  background: var(--primary-soft); color: var(--primary-dark); border-radius: 12px; font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}
.calc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.calc-row .lbl { margin: 0; flex: 0 0 auto; }
.calc-pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 12px; }
.calc-key {
  padding: 12px 4px; border-radius: 11px; border: 1px solid var(--line); background: var(--card);
  font: inherit; font-weight: 700; cursor: pointer; transition: all .12s; font-size: .92rem;
}
.calc-key:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-dark); }
.calc-key:active { transform: scale(.96); }
.calc-info { font-size: .88rem; border-top: 1px dashed var(--line); padding-top: 9px; margin-bottom: 10px; }
.calc-line { display: flex; justify-content: space-between; padding: 3px 0; }
.calc-history { margin-top: 10px; font-size: .82rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.calc-hist-row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); padding-bottom: 3px; }

/* ---------- ۳) پنل مدیریت ---------- */
.app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 250px; flex: 0 0 250px; background: var(--card); border-inline-end: 1px solid var(--line);
  padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.side-brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 16px; }
.side-brand .logo { font-size: 1.7rem; }
.side-brand b { display: block; font-size: 1rem; }
.side-brand span { font-size: .76rem; color: var(--muted); }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; cursor: pointer;
  color: var(--text); font-size: .93rem; border: none; background: transparent; font-family: inherit; text-align: right; width: 100%;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: var(--primary-soft); color: var(--primary-dark); }
.nav-item.active { background: var(--primary); color: #fff; font-weight: 700; }
.nav-badge { margin-inline-start: auto; background: var(--danger); color: #fff; font-size: .7rem; border-radius: 999px; padding: 1px 7px; }
.nav-item.active .nav-badge { background: rgba(255,255,255,.28); }
.main { flex: 1 1 auto; min-width: 0; padding: 18px 22px 60px; }
.topbar {
  display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 9px 14px; margin-bottom: 18px; position: sticky; top: 10px; z-index: 40; box-shadow: var(--shadow);
}
.topbar h2 { margin: 0; font-size: 1.05rem; }
.mobile-toggle { display: none; }
.page { display: none; }
.page.active { display: block; animation: fadeUp .25s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 0 10px; flex-wrap: wrap; }
.section-head h3 { margin: 0; display: flex; align-items: center; gap: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
@media (max-width: 1000px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* POS */
.pos-layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 1000px) { .pos-layout { grid-template-columns: 1fr; } }
.pos-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-height: 62vh; overflow-y: auto; padding: 3px; }
.pos-item { border: 1px solid var(--line); border-radius: 12px; padding: 9px; cursor: pointer; background: var(--card); transition: all .13s; text-align: center; }
.pos-item:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
.pos-item .p-name { font-size: .84rem; font-weight: 600; height: 40px; overflow: hidden; }
.pos-item .p-price { color: var(--primary-dark); font-weight: 700; font-size: .86rem; }
.pos-item .p-stock { font-size: .72rem; color: var(--muted); }
.cart-line { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.cart-line .c-name { flex: 1 1 auto; font-size: .88rem; }
.qty-box { display: inline-flex; align-items: center; gap: 4px; }

      if (prev) { if (c.score > prev.score) { prev.score = c.score; prev.why = c.why; prev.key = c.key; } return; }
      merged.push(c);

  function analyzePixels(pix, w, h, opts) {

  function fingerprint(pix, w, h) {
    var bits = [], i, j, cellW = w / 16, cellH = h / 16;
    for (i = 0; i < 16; i++) for (j = 0; j < 16; j++) {
      var sum = 0, n = 0;
      for (var y = Math.floor(i * cellH); y < Math.floor((i + 1) * cellH); y++)
        for (var x = Math.floor(j * cellW); x < Math.floor((j + 1) * cellW); x++) {
          var o = (y * w + x) * 4; sum += lum(pix[o], pix[o + 1], pix[o + 2]); n++;
        }
      bits.push(n ? sum / n : 0);
    }
    var mean = bits.reduce(function (a, b) { return a + b; }, 0) / bits.length;
    var bin = bits.map(function (v) { return v > mean ? 1 : 0; });
    var hex = '';
    for (i = 0; i < 256; i += 4) hex += parseInt('' + bin[i] + bin[i + 1] + bin[i + 2] + bin[i + 3], 2).toString(16);
    return hex;

    if (!a || !b || a.length !== b.length) return 999;
    var d = 0;
    for (var i = 0; i < a.length; i++) {

      d += (x & 1) + ((x >> 1) & 1) + ((x >> 2) & 1) + ((x >> 3) & 1);
    }

  var TW = 40, TH = 40;
  var PW = 640;

    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () {
        try {
          var ratio = img.width / img.height;
          var w = maxW, h = maxH;
          if (ratio > 1) h = Math.round(maxW / ratio); else w = Math.round(maxH * ratio);
          w = Math.max(2, Math.min(w, maxW)); h = Math.max(2, Math.min(h, maxH));
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          res({ pix: ctx.getImageData(0, 0, w, h).data, w: w, h: h });
        } catch (e) { rej(e); }

      img.onerror = function () { rej(new Error('تصویر قابل خواندن نیست')); };
      img.src = dataUrl;
    });
  }

  Shop.vision = {
    analyzePixels: analyzePixels,

    analyze: function (dataUrl, opts) {
      opts = opts || {};
      return drawTo(dataUrl, AW, AW).then(function (im) {
        var rep = analyzePixels(im.pix, im.w, im.h, opts);
        return drawTo(dataUrl, TW, TH).then(function (fp) {
          rep.fp = fingerprint(fp.pix, fp.w, fp.h);

        }).catch(function () { return rep; });
      });
    },
    prepare: function (dataUrl) {
      return U.compressImage(dataUrl, PW, 0.78).catch(function () { return { dataUrl: dataUrl, w: 0, h: 0 }; });
    },
    similar: function (fp, list, threshold) {

        .filter(function (x) { return x.dist <= th; })
        .sort(function (a, b) { return a.dist - b.dist; });
    },
    thumb: drawTo
  };

  /* ---------- محصولات ---------- */

  function uniqueBarcode(code, selfId) {

  function normalizeProduct(p) {

    out.cost = Math.max(0, U.num(out.cost));
    out.price = Math.max(0, U.num(out.price));
    out.wholesale = Math.max(0, U.num(out.wholesale));

    out.specs = (out.specs || []).filter(function (s) { return s && (s.k || s.v); }).slice(0, 20);
    out.custom = (out.custom || []).filter(function (s) { return s && (s.k || s.v); }).slice(0, 12);

  /* تغییر موجودی با ثبت گردش */

  function findByBarcode(code) {

  /* جست‌وجو و فیلتر */
  function searchProducts(opt) {
    opt = opt || {};
    var q = opt.q, cat = opt.cat, list = DB.products.slice();
    if (opt.activeOnly) list = list.filter(function (p) { return p.active !== false; });
    if (cat) {
      var kids = DB.categories.filter(function (c) { return c.parentId === cat; }).map(function (c) { return c.id; });
      var ids = [cat].concat(kids);
      list = list.filter(function (p) { return ids.indexOf(p.categoryId) > -1; });
    }
    if (opt.lowOnly) list = list.filter(function (p) { return p.stock <= (p.minStock || 0); });
    if (opt.outOnly) list = list.filter(function (p) { return p.stock <= 0; });
    if (q) {
      list = list.map(function (p) {
        var hay = p.name + ' ' + (p.brand || '') + ' ' + (p.tags || []).join(' ') + ' ' + (p.sku || '') + ' ' + (p.barcode || '') + ' ' + (p.supplier || '');
        return { p: p, s: U.matchScore(q, hay, p.tags) + (p.barcode && String(p.barcode).indexOf(U.toEn(q)) > -1 ? 1 : 0) };
      }).filter(function (x) { return x.s > 0.42; })
        .sort(function (a, b) { return b.s - a.s; })

    }
    var sort = opt.sort || 'name';
    var sorters = {

      priceAsc: function (a, b) { return a.price - b.price; },
      priceDesc: function (a, b) { return b.price - a.price; },
      stockAsc: function (a, b) { return a.stock - b.stock; },
      stockDesc: function (a, b) { return b.stock - a.stock; },
      sold: function (a, b) { return (b.soldTotal || 0) - (a.soldTotal || 0); },
      value: function (a, b) { return b.stock * b.cost - a.stock * a.cost; }

  function effectivePrice(p, qty) {

  function bulkPrice(opt) {
    var ids = opt.ids && opt.ids.length ? opt.ids : DB.products.map(function (p) { return p.id; });
    var changed = 0;
    ids.forEach(function (id) {
      var p = getProduct(id);
      if (!p) return;
      var base = opt.basis === 'cost' ? p.cost : p.price;
      var val = 0;
      if (opt.mode === 'pct') val = base * (1 + opt.value / 100);
      else if (opt.mode === 'set') val = opt.value;
      else if (opt.mode === 'add') val = p.price + opt.value;
      else if (opt.mode === 'round') val = p.price;
      if (opt.rounding && opt.rounding !== 'none') {
        var step = opt.rounding === 'up' ? 1000 : opt.rounding === 'up500' ? 500 : 1000;
        val = opt.rounding === 'up' ? Math.ceil(val / step) * step : Math.floor(val / step) * step;
      }
      if (opt.mode !== 'set' && opt.mode !== 'round' && opt.basis === 'cost') {
        /* وقتی پایه قیمت خرید است، باید سود هدف لحاظ شود */
        val = opt.mode === 'pct' ? base * (1 + opt.value / 100) : val;
      }
      val = Math.max(0, Math.round(val));
      if (val !== p.price) { p.price = val; p.updatedAt = Date.now(); changed++; }
    });
    if (changed) { log('تغییر گروهی قیمت', U.toFa(changed) + ' جنس'); save(); }

  /* ---------- فروش ---------- */
  function addSale(input) {
    var items = (input.items || []).map(function (it) {
      var p = getProduct(it.pid);
      if (!p) throw new Error('جنس پیدا نشد');
      var qty = U.num(it.qty);
      if (qty <= 0) throw new Error('تعداد نامعتبر برای «' + p.name + '»');
      if (p.stock < qty && !DB.settings.allowNegativeStock) throw new Error('موجودی «' + p.name + '» کافی نیست (موجودی: ' + U.toFa(U.group(p.stock)) + ')');
      return {
        pid: p.id, name: p.name, qty: qty, price: U.num(it.price != null ? it.price : p.price),
        cost: U.num(p.cost), discount: U.num(it.discount || 0)
      };
    });
    if (!items.length) throw new Error('سبد خالی است');
    var subtotal = U.sum(items, function (i) { return i.price * i.qty - i.discount; });
    var discount = U.num(input.discount || 0);
    var taxPct = U.num(input.taxPct || 0);
    var tax = Math.round((subtotal - discount) * taxPct / 100);
    var total = subtotal - discount + tax;
    var profit = U.sum(items, function (i) { return (i.price - i.cost) * i.qty - i.discount; }) - discount;
    var sale = {
      id: U.uuid('s'), no: DB.counters.sale++, at: Date.now(), items: items,
      subtotal: subtotal, discount: discount, tax: tax, taxPct: taxPct, total: total,
      profit: profit, payment: input.payment || 'cash',
      customer: input.customer || null, note: input.note || '',
      channel: input.channel || 'pos'
    };
    /* موجودی */
    items.forEach(function (it) {
      var p = getProduct(it.pid);
      var before = p.stock;
      p.stock = before - it.qty;
      p.soldTotal = (p.soldTotal || 0) + it.qty;
      p.lastSaleAt = sale.at;
      p.updatedAt = sale.at;
      addMovement(p.id, 'sale', -it.qty, before, p.stock, 'فاکتور ' + U.toFa(sale.no));
    });
    DB.sales.push(sale);
    log('فروش', 'فاکتور ' + U.toFa(sale.no) + ' — ' + U.toman(total));
    save();
    return sale;
  }
  function removeSale(id) {
    var idx = DB.sales.findIndex(function (s) { return s.id === id; });
    if (idx < 0) throw new Error('فاکتور پیدا نشد');
    var sale = DB.sales[idx];
    sale.items.forEach(function (it) {
      var p = getProduct(it.pid);
      if (!p) return;
      var before = p.stock;
      p.stock = before + it.qty;
      p.soldTotal = Math.max(0, (p.soldTotal || 0) - it.qty);

  function salesInRange(from, to) {

  /* ---------- ماشین‌حساب قیمت ---------- */
  var pricing = {

    /* تحلیل کامل یک جنس */

      var days = p.lastSaleAt ? Math.max(1, (Date.now() - (p.createdAt || p.lastSaleAt)) / 86400000) : 1;

        margin: m, markup: mk, profitUnit: price - cost,

  /* ---------- تحلیل و گزارش ---------- */
  function stats(from, to) {

    var revenue = U.sum(sales, function (s) { return s.total; });

    var cost = U.sum(sales, function (s) { return U.sum(s.items, function (i) { return i.cost * i.qty; }); });
    var items = U.sum(sales, function (s) { return U.sum(s.items, function (i) { return i.qty; }); });
    var byDay = {}, byCat = {}, byPayment = { cash: 0, card: 0, credit: 0 }, byProduct = {};
    sales.forEach(function (s) {
      var k = U.dayKey(s.at);
      byDay[k] = byDay[k] || { key: k, revenue: 0, profit: 0, orders: 0, items: 0, at: s.at };
      byDay[k].revenue += s.total; byDay[k].profit += s.profit; byDay[k].orders++; byDay[k].items += U.sum(s.items, function (i) { return i.qty; });
      s.items.forEach(function (i) {
        var p = getProduct(i.pid);

        byCat[cid].revenue += i.price * i.qty; byCat[cid].qty += i.qty;

      byPayment: byPayment,

  function stockSummary() {

  }
  /* پیش‌بینی نیاز به سفارش بر پایه‌ی میانگین فروش ۳۰ روز */
  function restockSuggestions(daysAhead) {

    var qtyMap = {};
    st.topProducts.forEach(function (t) { qtyMap[t.pid] = t.qty; });
    var out = [];
    DB.products.forEach(function (p) {

  /* کالاهایی که با هم خریده می‌شوند (پیشنهاد به مشتری) */
  function basketPairs(pid) {

  function csvExportProducts() {

      ['ماست ۲ کیلویی', 'SKU-9002', '', 'لبنیات', 'ظرف', '98000', '125000', '', '10', '4', 'لبنیات دامداران', 'یخچال ۱', 'لبنی|تازه', '', '', '']

  /* ---------- حساب مدیر ---------- */

  <script>

/* ============================================================

(function (root) {

  function rangeFor(frequency, now) {
    now = now || Date.now();

    var today = U.jalali(now);
    if (frequency === 'daily') {
      var d = new Date(now); d.setHours(0, 0, 0, 0);

      start = new Date(now - 7 * 86400000).getTime();

      start = new Date(now - 14 * 86400000).getTime();
    } else {
      start = new Date(now - 30 * 86400000).getTime();
    }

  }

  }

  /* ---------- ساخت داده‌ی گزارش ---------- */

    var sum = S.stockSummary();

    var prevRange = { start: r.start - (r.end - r.start), end: r.start };
    var prev = S.stats(prevRange.start, prevRange.end);
    var growth = prev.revenue > 0 ? (st.revenue - prev.revenue) / prev.revenue * 100 : null;

    return {
      shop: S.db.shop, at: now || Date.now(), range: r, stats: st,

      low: sum.low.slice(0, 10), out: sum.out.slice(0, 10), dead: sum.dead.slice(0, 5),
      expiring: sum.expiring.slice(0, 8), restock: restock.slice(0, 8), restockCount: restock.length,
      top: top, slow: slow, growth: growth, prevRevenue: prev.revenue,
      cash: st.byPayment.cash || 0, card: st.byPayment.card || 0, credit: st.byPayment.credit || 0,

  /* ---------- متن گزارش ---------- */
  function renderText(rep, opt) {
    opt = opt || {};
    var inc = (S.db.notify && S.db.notify.include) || {};
    var t = [];
    var freq = S.db.notify.frequency || 'daily';
    var title = { daily: 'گزارش پایان روز', weekly: 'گزارش هفتگی', biweekly: 'گزارش دوهفته‌ای', monthly: 'گزارش ماهانه' }[freq] || 'گزارش فروش';
    t.push('📊 ' + title + ' — ' + (rep.shop.name || 'فروشگاه'));
    t.push('🗓 ' + U.jDateLong(rep.at) + ' — ساعت ' + U.jTime(rep.at));
    t.push('📅 بازه: ' + rep.range.label);
    t.push('');

    if (inc.sales !== false) {
      t.push('💰 فروش: ' + U.toman(rep.stats.revenue, rep.shop.currency) + '  (' + U.toFa(rep.stats.orders) + ' فاکتور)');
      if (rep.growth != null) {
        t.push('   ' + (rep.growth >= 0 ? '🔺' : '🔻') + ' نسبت به بازه‌ی قبل: ' + U.percent(Math.abs(rep.growth)) + (rep.growth >= 0 ? ' افزایش' : ' کاهش'));
      }
    }
    if (inc.profit !== false) {
      t.push('📈 سود برآوردی: ' + U.toman(rep.stats.profit, rep.shop.currency) + '  (' + U.percent(rep.stats.margin) + ' حاشیه)');
    }
    if (inc.sales !== false) {
      t.push('🧾 میانگین هر فاکتور: ' + U.toman(rep.stats.avgOrder, rep.shop.currency));
      t.push('🔢 تعداد اقلام فروخته‌شده: ' + U.toFa(U.group(rep.stats.items)) + ' عدد');
      t.push('💵 نقد: ' + U.toman(rep.cash) + '   💳 کارتی: ' + U.toman(rep.card) + (rep.credit ? '   📝 نسیه: ' + U.toman(rep.credit) : ''));
    }
    if (inc.top !== false && rep.top.length) {
      t.push('');
      t.push('🏆 پرفروش‌ترین‌ها:');
      rep.top.forEach(function (x, i) { t.push('   ' + U.toFa(i + 1) + '. ' + x.name + ' — ' + U.toFa(U.group(x.qty)) + ' عدد'); });
    }
    if (inc.lowStock !== false) {
      t.push('');
      if (rep.out.length) {
        t.push('❌ ناموجود (' + U.toFa(rep.out.length) + ' قلم):');
        rep.out.forEach(function (p) { t.push('   • ' + p.name); });
      }
      if (rep.low.length) {
        t.push('⚠️ کم‌موجود (' + U.toFa(rep.low.length) + ' قلم):');
        rep.low.forEach(function (p) { t.push('   • ' + p.name + ' — ' + U.toFa(U.group(p.stock)) + ' ' + p.unit); });
      }
      if (!rep.out.length && !rep.low.length) t.push('✅ موجودی همه‌ی اقلام در حد مطلوب است.');
    }
    if (inc.expiry !== false && rep.expiring.length) {
      t.push('');
      t.push('🧊 نزدیک تاریخ انقضا:');
      rep.expiring.forEach(function (x) {
        t.push('   • ' + x.p.name + ' — ' + (x.days <= 0 ? 'منقضی شده!' : U.toFa(x.days) + ' روز مانده'));
      });
    }
    if (inc.dead !== false && rep.dead.length) {
      t.push('');
      t.push('🐢 راکد (بیش از ۹۰ روز بدون فروش):');
      rep.dead.forEach(function (x) { t.push('   • ' + x.p.name + ' — ' + U.toFa(x.days) + ' روز'); });
    }
    if (inc.value !== false) {
      t.push('');
      t.push('🏷 ارزش موجودی انبار (به قیمت خرید): ' + U.toman(rep.stock.value, rep.shop.currency));
      t.push('   ارزش فروش موجودی: ' + U.toman(rep.stock.retail, rep.shop.currency) + '  |  سود بالقوه: ' + U.toman(rep.stock.retail - rep.stock.value, rep.shop.currency));
      t.push('   تعداد اقلام: ' + U.toFa(rep.stock.count) + ' جنس / ' + U.toFa(U.group(rep.stock.units)) + ' عدد در انبار');
    }
    if (rep.restock.length) {
      t.push('');
      t.push('📦 پیشنهاد سفارش برای ۲ هفته‌ی آینده (' + U.toFa(rep.restockCount) + ' قلم):');
      rep.restock.forEach(function (x) {
        t.push('   • ' + x.p.name + ' → ' + U.toFa(U.group(x.order)) + ' ' + x.p.unit +
          ' (فروش ۳۰ روز: ' + U.toFa(x.sold30) + ')' + (x.urgency === 'out' ? ' ❗' : ''));
      });
    }
    if (opt.footer !== false) {
      t.push('');
      t.push('— ارسال خودکار از «مدیر فروشگاه»');
    }
    return t.join('\n');
  }

  function renderHtml(rep) {
    var rows = [];
    function row(k, v) { rows.push('<tr><th>' + U.esc(k) + '</th><td>' + v + '</td></tr>'); }
    row('بازه', U.esc(rep.range.label));
    row('فروش', '<b>' + U.toman(rep.stats.revenue, rep.shop.currency) + '</b> در ' + U.toFa(rep.stats.orders) + ' فاکتور');
    row('سود برآوردی', U.toman(rep.stats.profit, rep.shop.currency) + ' (' + U.percent(rep.stats.margin) + ')');
    row('میانگین فاکتور', U.toman(rep.stats.avgOrder, rep.shop.currency));
    row('نقد / کارتی / نسیه', U.toman(rep.cash) + ' / ' + U.toman(rep.card) + ' / ' + U.toman(rep.credit));
    row('ارزش انبار', U.toman(rep.stock.value, rep.shop.currency) + ' (سود بالقوه ' + U.toman(rep.stock.retail - rep.stock.value) + ')');
    row('ناموجود', rep.out.length ? rep.out.map(function (p) { return U.esc(p.name); }).join('، ') : 'ندارد');
    row('کم‌موجود', rep.low.length ? rep.low.map(function (p) { return U.esc(p.name) + ' (' + U.toFa(p.stock) + ')'; }).join('، ') : 'ندارد');
    if (rep.top.length) row('پرفروش‌ترین', rep.top.map(function (x) { return U.esc(x.name) + ' ×' + U.toFa(x.qty); }).join('، '));
    if (rep.expiring.length) row('نزدیک انقضا', rep.expiring.map(function (x) { return U.esc(x.p.name) + ' (' + U.toFa(x.days) + ' روز)'; }).join('، '));
    if (rep.restock.length) row('پیشنهاد سفارش', rep.restock.map(function (x) { return U.esc(x.p.name) + ' → ' + U.toFa(x.order) + ' ' + U.esc(x.p.unit); }).join('، '));
    return '<div dir="rtl" style="font-family:Tahoma,sans-serif;background:#f6f8f9;padding:18px">' +
      '<h2 style="color:#0e9f6e">📊 گزارش فروش ' + U.esc(rep.shop.name) + '</h2>' +
      '<p style="color:#667">' + U.jDateLong(rep.at) + ' — ' + U.esc(rep.range.label) + '</p>' +
      '<table cellpadding="8" cellspacing="0" style="border-collapse:collapse;background:#fff;min-width:420px">' +
      rows.map(function (r) { return r.replace('<tr>', '<tr style="border-bottom:1px solid #eee">').replace('<th>', '<th align="right" style="color:#667;font-weight:normal">'); }).join('') +
      '</table><p style="color:#667;font-size:12px">ارسال خودکار از «مدیر فروشگاه»</p></div>';
  }

  /* ---------- زمان‌بند ---------- */
  function parseTime(str) {
    var m = String(U.toEn(str || '21:00')).match(/(\d{1,2})\s*[:.]?\s*(\d{1,2})?/);
    var h = m ? U.clamp(parseInt(m[1], 10), 0, 23) : 21;
    var mi = m && m[2] ? U.clamp(parseInt(m[2], 10), 0, 59) : 0;
    return { h: h, m: mi };
  }
  /* آیا الان زمان ارسال است؟ */
  function isDue(now) {
    now = now || new Date();
    var n = S.db.notify;
    if (!n.enabled) return { due: false, reason: 'اطلاع‌رسانی خاموش است' };
    var tm = parseTime(n.time);
    var todayKey = U.dayKey(now);
    if (n.lastSentDay === todayKey) return { due: false, reason: 'امروز ارسال شده است' };
    var cur = now.getHours() * 60 + now.getMinutes();
    if (cur < tm.h * 60 + tm.m) return { due: false, reason: 'هنوز به ساعت ' + U.toFa(n.time) + ' نرسیده' };
    /* فرکانس */
    var lastAt = n.lastSent ? new Date(n.lastSent) : null;
    var daysSince = lastAt ? Math.floor((now - lastAt) / 86400000) : 999;
    if (n.frequency === 'daily') {
      if (lastAt && U.dayKey(lastAt) === todayKey) return { due: false, reason: 'امروز ارسال شده است' };
    } else if (n.frequency === 'weekly') {
      var wd = (now.getDay() + 1) % 7; /* شنبه = ۰ */
      if (wd !== (n.weekday == null ? 6 : n.weekday)) return { due: false, reason: 'روز هفته مطابق نیست' };
      if (daysSince < 6) return { due: false, reason: 'کمتر از یک هفته از ارسال قبل گذشته' };
    } else if (n.frequency === 'biweekly') {
      if (daysSince < 13) return { due: false, reason: 'دوره‌ی دو هفته‌ای کامل نشده' };
    } else if (n.frequency === 'monthly') {
      var jm = U.jalali(now).jd;
      if (jm !== (n.dayOfMonth == null ? 1 : n.dayOfMonth)) return { due: false, reason: 'روز ماه مطابق نیست' };
      if (daysSince < 27) return { due: false, reason: 'دوره‌ی ماهانه کامل نشده' };
    }
    return { due: true, reason: 'زمان ارسال رسیده است' };
  }
  function nextDue(now) {
    now = now || new Date();
    var n = S.db.notify, tm = parseTime(n.time);
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate(), tm.h, tm.m, 0, 0);
    if (n.frequency === 'daily') {
      if (d <= now || U.dayKey(d) === U.dayKey(n.lastSent || 0)) d.setDate(d.getDate() + 1);
    } else if (n.frequency === 'weekly') {
      var target = n.weekday == null ? 6 : n.weekday;
      while (((d.getDay() + 1) % 7) !== target || d <= now) d.setDate(d.getDate() + 1);
    } else if (n.frequency === 'biweekly') {
      while (d <= now) d.setDate(d.getDate() + 1);
      if (n.lastSent) {
        var min = new Date(new Date(n.lastSent).getTime() + 13 * 86400000);
        while (d < min) d.setDate(d.getDate() + 1);
      }
    } else {
      var day = n.dayOfMonth == null ? 1 : n.dayOfMonth;
      var guard = 0;
      while (U.jalali(d).jd !== day || d <= now) { d.setDate(d.getDate() + 1); if (guard++ > 400) break; }
    }
    return d;
  }
  function markSent(channel, target, ok, detail) {
    var n = S.db.notify;
    n.lastSent = Date.now();
    n.lastSentDay = U.dayKey();
    n.history = n.history || [];
    n.history.unshift({ at: Date.now(), channel: channel || n.channel, target: target || n.target, ok: ok !== false, detail: detail || '' });
    if (n.history.length > 50) n.history.length = 50;
    S.save();
  }

  /* ---------- کانال‌ها ---------- */
  function channelLabel(ch) {
    return {
      email: 'ایمیل', whatsapp: 'واتساپ', sms: 'پیامک', telegram: 'تلگرام',
      browser: 'اعلان مرورگر', webhook: 'وبهوک/بات', copy: 'کپی متن', emailjs: 'ایمیل خودکار (EmailJS)'
    }[ch] || ch;
  }
  function buildLink(channel, target, subject, body) {
    var enc = encodeURIComponent;
    switch (channel) {
      case 'email':
        return 'mailto:' + enc(target || '') + '?subject=' + enc(subject || 'گزارش فروش') + '&body=' + enc(body);
      case 'whatsapp': {
        var digits = String(U.toEn(target || '')).replace(/[^\d]/g, '');
        return 'https://wa.me/' + digits + '?text=' + enc(body);
      }
      case 'sms': {
        var d2 = String(U.toEn(target || '')).replace(/[^\d+]/g, '');
        return 'sms:' + d2 + '?&body=' + enc(body);
      }
      case 'telegram': {
        var tg = String(target || '').replace(/^@/, '');
        return tg ? ('https://t.me/' + tg) : ('https://t.me/share/url?url=' + enc('https://t.me') + '&text=' + enc(body));
      }
      default: return '';
    }
  }
  /* ارسال از راه ایمیل خودکار (EmailJS — رایگان، بدون سرور) */
  function sendViaEmailJS(rep, cfg, text) {
    return new Promise(function (res, rej) {
      if (!cfg || !cfg.serviceId || !cfg.templateId || !cfg.publicKey) {
        return rej(new Error('تنظیمات EmailJS کامل نیست (Service ID، Template ID و Public Key لازم است)'));
      }
      var payload = {
        service_id: cfg.serviceId,
        template_id: cfg.templateId,
        user_id: cfg.publicKey,
        template_params: {
          to_email: cfg.to || (S.db.notify.target || ''),
          shop_name: rep.shop.name, subject: cfg.subject || ('گزارش فروش ' + rep.shop.name),
          report_text: text, report_html: renderHtml(rep),
          revenue: U.group(rep.stats.revenue), profit: U.group(rep.stats.profit),
          orders: rep.stats.orders, low_count: rep.low.length, out_count: rep.out.length
        }
      };
      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://api.emailjs.com/api/v1.0/email/send', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) res(true);
        else rej(new Error('EmailJS: ' + xhr.status + ' ' + xhr.responseText));
      };
      xhr.onerror = function () { rej(new Error('خطای شبکه در ارسال ایمیل (اتصال اینترنت و صحت کلیدها را بررسی کنید)')); };
      xhr.send(JSON.stringify(payload));
    });
  }
  function sendViaWebhook(rep, url, text) {
    return new Promise(function (res, rej) {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', url, true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function () { (xhr.status >= 200 && xhr.status < 300) ? res(true) : rej(new Error('وبهوک: کد ' + xhr.status)); };
      xhr.onerror = function () { rej(new Error('خطای شبکه در وبهوک')); };
      xhr.send(JSON.stringify({
        shop: rep.shop.name, at: rep.at, range: rep.range.label,
        revenue: rep.stats.revenue, profit: rep.stats.profit, orders: rep.stats.orders,
        low: rep.low.map(function (p) { return p.name; }), out: rep.out.map(function (p) { return p.name; }),
        stockValue: rep.stock.value, text: text
      }));
    });
  }
  function notifyBrowser(rep, text) {
    return new Promise(function (res) {
      if (!root.Notification) return res(false);
      var fire = function () {
        try {
          new root.Notification('گزارش فروش ' + rep.shop.name, { body: text.slice(0, 240), dir: 'rtl', lang: 'fa' });
          res(true);
        } catch (e) { res(false); }
      };
      if (root.Notification.permission === 'granted') fire();
      else if (root.Notification.requestPermission) root.Notification.requestPermission().then(function (p) { p === 'granted' ? fire() : res(false); });
      else res(false);
    });
  }

  /* ارسال با کانال تنظیم‌شده */
  function send(opt) {
    opt = opt || {};
    var rep = opt.report || buildReport(S.db.notify.frequency || 'daily');
    var text = renderText(rep);
    var n = S.db.notify;
    var channel = opt.channel || n.channel;
    var target = opt.target || n.target;
    var subject = 'گزارش ' + (rep.shop.name || 'فروشگاه') + ' — ' + U.jDate(rep.at);

    return notifyBrowser(rep, text).catch(function () { return false; }).then(function () {
      switch (channel) {
        case 'browser':
          markSent(channel, '', true);
          return { ok: true, mode: 'native', message: 'اعلان مرورگر ارسال شد' };
        case 'copy':
          return U.copy(text).then(function () {
            markSent(channel, '', true);
            return { ok: true, mode: 'native', message: 'متن گزارش کپی شد' };
          });
        case 'emailjs':
          return sendViaEmailJS(rep, n.emailjs || {}, text).then(function () {
            markSent(channel, target, true);
            return { ok: true, mode: 'api', message: 'ایمیل گزارش ارسال شد' };
          });
        case 'webhook':
          return sendViaWebhook(rep, target, text).then(function () {
            markSent(channel, target, true);
            return { ok: true, mode: 'api', message: 'وبهوک با موفقیت فراخوانی شد' };
          });
        default: {
          var link = buildLink(channel, target, subject, text);
          markSent(channel, target, true, 'لینک آماده شد');
          return { ok: true, mode: 'link', link: link, text: text, message: 'آماده‌ی ارسال در ' + channelLabel(channel) };
        }
      }
    });
  }

  /* ---------- زمان‌سنج پس‌زمینه ---------- */
  var timer = null, lastChecked = 0;
  function start(intervalMs) {
    stop();
    var tick = function () {
      var now = new Date();
      var d = isDue(now);
      if (d.due) {
        var n = S.db.notify;
        var mode = n.channel;
        var auto = (mode === 'emailjs' || mode === 'webhook' || mode === 'browser' || mode === 'copy');
        if (auto) {
          send({}).then(function (r) {
            U.toast('گزارش خودکار ارسال شد (' + channelLabel(mode) + ')', 'ok', 4000);
          }).catch(function (e) {
            U.toast('ارسال خودکار ناموفق بود: ' + e.message + ' — متن گزارش کپی شد تا دستی بفرستید.', 'err', 6000);
            markSent(mode, n.target, false, e.message);
          });
        } else if (n.time && n.autoOpen !== false) {
          /* کانال‌های لینکی: پنجره‌ی ارسال را باز کن */
          U.toast('زمان گزارش رسیده است — پنجره‌ی ارسال باز می‌شود', 'info', 4000);
          send({}).then(function (r) {
            if (r.link) { try { root.open(r.link, '_blank'); } catch (e) { } }
          });
        }
      }
      lastChecked = Date.now();
      if (Shop.dash && Shop.dash.refreshNotifyStatus) Shop.dash.refreshNotifyStatus();
    };
    timer = setInterval(tick, intervalMs || 60000);
    setTimeout(tick, 4000);
    return timer;
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }

  Shop.notify = {
    rangeFor: rangeFor, buildReport: buildReport, renderText: renderText, renderHtml: renderHtml,
    parseTime: parseTime, isDue: isDue, nextDue: nextDue, markSent: markSent,
    channelLabel: channelLabel, buildLink: buildLink,
    send: send, sendViaEmailJS: sendViaEmailJS, sendViaWebhook: sendViaWebhook, notifyBrowser: notifyBrowser,
    start: start, stop: stop,
    get lastChecked() { return lastChecked; }
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>
/* ==== assets/js/nlp.js ==== */
/* ============================================================
   Shop Manager — End-of-Day NLP Engine
   پیام پایان روز مالک مغازه را می‌خواند، جنس و تعداد و نوع عملیات را
   درمی‌آورد و موجودی انبار را خودکار به‌روز می‌کند.
   نمونه: «امروز ۳ تا نوشابه خانواده فروختم، ۵ عدد آب معدنی اضافه شد،
          یک ماست خراب شد دور ریختم»
   ============================================================ */
(function (root) {
  'use strict';
  var Shop = (root.Shop = root.Shop || {});
  var U = Shop.U, S = Shop.store;

  /* ---------- واژه‌های عددی فارسی ---------- */
  var ONES = {
    'صفر': 0, 'یک': 1, 'دو': 2, 'سه': 3, 'چهار': 4, 'پنج': 5, 'شش': 6, 'هفت': 7, 'هشت': 8, 'نه': 9, 'ده': 10,
    'یازده': 11, 'دوازده': 12, 'سیزده': 13, 'چهارده': 14, 'پانزده': 15, 'شانزده': 16, 'هفده': 17, 'هجده': 18, 'نوزده': 19,
    'بیست': 20, 'سی': 30, 'چهل': 40, 'پنجاه': 50, 'شصت': 60, 'هفتاد': 70, 'هشتاد': 80, 'نود': 90,
    'صد': 100, 'یکصد': 100, 'دویست': 200, 'سیصد': 300, 'چهارصد': 400, 'پانصد': 500, 'ششصد': 600, 'هفتصد': 700, 'هشتصد': 800, 'نهصد': 900,
    'هزار': 1000, 'نیم': 0.5, 'یه': 1, 'یك': 1
  };
  var NUM_UNITS = ['عدد', 'تا', 'دانه', 'بسته', 'کارتن', 'کیلو', 'کیلوگرم', 'گرم', 'لیتر', 'بطری', 'قوطی', 'شیشه', 'قرص', 'جعبه', 'بکس', 'شرابه', 'نفر'];

  function wordsToNumber(tokens) {
    var total = 0, cur = 0, found = false, isHalf = false;
    tokens.forEach(function (tk) {
      var v = ONES[tk];
      if (v == null) return;
      found = true;
      if (v === 0.5) { isHalf = true; return; }
      if (v === 1000) { total += (cur || 1) * 1000; cur = 0; }
      else if (v >= 100) { cur += v; }
      else cur += v;
    });
    if (!found) return null;
    var n = total + cur;
    if (isHalf) n = (n || 1) - 0.5;
    return n;
  }

  /* ---------- الگوهای عملیات ---------- */
  var OPS = [
    {
      key: 'sale', label: 'فروش', sign: -1, tag: '🟢',
      words: ['فروختم', 'فروختیم', 'فروش', 'فروشرفت', 'فروش رفت', 'فروخته شد', 'بفروش', 'حراج', 'مشتری خرید', 'خرید مشتری', 'دادم', 'رفت', 'خریداری شد', 'سفارش']
    },
    {
      key: 'restock', label: 'افزایش موجودی', sign: 1, tag: '📦',

  function stockPill(p) {

    if (st[1] === 'warn' && p.stock > (p.minStock || 0) * 1.5) st = ['موجود', 'ok'];

  /* ---------- جدول ---------- */
  function table(spec) {
    var state = { sort: spec.sort || null, dir: spec.dir || 'desc', page: 1, perPage: spec.perPage || 25 };
    var wrap = U.el('div', { class: 'table-wrap' });
    var toolbar = U.el('div', { class: 'table-tools' });
    var searchInput = null;
    if (spec.searchable) {
      searchInput = U.el('input', { class: 'input input-sm', type: 'search', placeholder: 'جست‌وجو در جدول…' });
      toolbar.appendChild(U.el('div', { class: 'grow' }, [searchInput]));
    }
    var countEl = U.el('span', { class: 'muted small' });
    toolbar.appendChild(countEl);
    wrap.appendChild(toolbar);

    var tbl = U.el('table', { class: 'table' });
    var thead = U.el('thead'), tbody = U.el('tbody');
    tbl.appendChild(thead); tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    var pager = U.el('div', { class: 'pager' });
    wrap.appendChild(pager);

    function currentRows() {
      var rows = spec.rows.slice();
      var q = searchInput ? U.norm(searchInput.value) : '';
      if (q) rows = rows.filter(function (r) { return U.norm(spec.searchText ? spec.searchText(r) : JSON.stringify(r)).indexOf(q) > -1; });
      if (state.sort && spec.sorters && spec.sorters[state.sort]) {
        rows.sort(function (a, b) {
          var v = spec.sorters[state.sort](a, b);
          return state.dir === 'asc' ? v : -v;
        });
      }
      return rows;
    }
    function render() {
      thead.innerHTML = '';
      var tr = U.el('tr');
      spec.columns.forEach(function (col) {
        var th = U.el('th', { class: col.class || '' }, [U.el('span', { text: col.title })]);
        if (spec.sorters && spec.sorters[col.key]) {
          th.classList.add('sortable');
          if (state.sort === col.key) th.classList.add(state.dir === 'asc' ? 'asc' : 'desc');
          th.addEventListener('click', function () {
            if (state.sort === col.key) state.dir = state.dir === 'asc' ? 'desc' : 'asc';
            else { state.sort = col.key; state.dir = 'desc'; }
            render();
          });
        }
        tr.appendChild(th);
      });
      thead.appendChild(tr);

      var rows = currentRows();
      var pages = Math.max(1, Math.ceil(rows.length / state.perPage));
      state.page = U.clamp(state.page, 1, pages);
      var slice = rows.slice((state.page - 1) * state.perPage, state.page * state.perPage);
      tbody.innerHTML = '';
      if (!slice.length) {
        tbody.appendChild(U.el('tr', {}, [U.el('td', { colspan: spec.columns.length }, [
          U.el('div', { class: 'empty', text: spec.empty || 'موردی یافت نشد' })
        ])]));
      }
      slice.forEach(function (row) {
        var trr = U.el('tr');
        if (spec.rowAttrs) Object.keys(spec.rowAttrs(row)).forEach(function (k) { trr.setAttribute(k, spec.rowAttrs(row)[k]); });
        spec.columns.forEach(function (col) {
          var td = U.el('td', { class: (col.class || '') + ' col-' + col.key });
          var v = col.render ? col.render(row) : row[col.key];
          if (v && v.nodeType) td.appendChild(v);
          else td.innerHTML = v == null ? '' : v;
          if (col.title) td.setAttribute('data-label', col.title);
          trr.appendChild(td);
        });
        if (spec.onRowClick) trr.addEventListener('click', function (e) {
          if (e.target.closest('button,a,input,select')) return;
          spec.onRowClick(row);
        });
        tbody.appendChild(trr);
      });
      countEl.textContent = U.toFa(rows.length) + ' مورد';
      pager.innerHTML = '';
      if (pages > 1) {
        var prev = U.el('button', { class: 'btn btn-ghost btn-sm', text: 'قبلی', disabled: state.page === 1 }, []);
        prev.addEventListener('click', function () { state.page--; render(); });
        pager.appendChild(prev);
        pager.appendChild(U.el('span', { class: 'muted small', text: 'صفحه ' + U.toFa(state.page) + ' از ' + U.toFa(pages) }));
        var next = U.el('button', { class: 'btn btn-ghost btn-sm', text: 'بعدی', disabled: state.page === pages });
        next.addEventListener('click', function () { state.page++; render(); });
        pager.appendChild(next);
      }
    }
    if (searchInput) searchInput.addEventListener('input', U.debounce(function () { state.page = 1; render(); }, 200));
    render();
    return { el: wrap, render: render, setRows: function (r) { spec.rows = r; render(); } };
  }

  /* ---------- نمودارها (SVG خالص) ---------- */
  function lineChart(values, opt) {
    opt = opt || {};
    var w = opt.width || 700, h = opt.height || 200, pad = { t: 14, r: 12, b: 26, l: 46 };
    if (!values.length) return U.el('div', { class: 'empty', text: 'داده‌ای نیست' });
    var max = Math.max.apply(null, values.map(function (v) { return v.y; })) * 1.15 || 1;
    var iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    var step = values.length > 1 ? iw / (values.length - 1) : iw;
    var pts = values.map(function (v, i) {
      return [pad.l + i * step, pad.t + ih - (v.y / max) * ih];
    });
    var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var area = path + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (pad.t + ih) + ' L' + pts[0][0].toFixed(1) + ' ' + (pad.t + ih) + ' Z';
    var grid = '', labels = '';
    for (var g = 0; g <= 4; g++) {
      var y = pad.t + ih * g / 4;
      grid += '<line x1="' + pad.l + '" y1="' + y + '" x2="' + (w - pad.r) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>';
      labels += '<text x="' + (pad.l - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">' + U.moneyShort(max * (4 - g) / 4) + '</text>';
    }
    var xlabels = '';
    var every = Math.ceil(values.length / 7);
    values.forEach(function (v, i) {
      if (i % every) return;
      xlabels += '<text x="' + pts[i][0].toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' + U.esc(v.x) + '</text>';
    });
    var dots = opt.points === false ? '' : pts.map(function (p, i) {
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="var(--primary)"><title>' + U.esc((values[i].label || values[i].x) + ': ' + U.toman(values[i].y)) + '</title></circle>';
    }).join('');
    var svg = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img">' +
      '<defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary)" stop-opacity=".34"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>' +
      grid + '<path d="' + area + '" fill="url(#lg1)"/>' +
      '<path d="' + path + '" fill="none" stroke="var(--primary)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + labels + xlabels + '</svg>';
    var box = U.el('div', { class: 'chart-box' });
    box.innerHTML = svg;
    return box;
  }
  function barChart(items, opt) {
    opt = opt || {};
    if (!items.length) return U.el('div', { class: 'empty', text: 'داده‌ای نیست' });
    var max = Math.max.apply(null, items.map(function (i) { return i.value; })) || 1;
    var list = U.el('div', { class: 'bars' });
    items.forEach(function (it) {
      var row = U.el('div', { class: 'bar-row' });
      row.innerHTML = '<span class="bar-label">' + U.esc(it.label) + '</span>' +
        '<span class="bar-track"><i style="width:' + Math.max(2, it.value / max * 100).toFixed(1) + '%;background:' + (it.color || 'var(--primary)') + '"></i></span>' +
        '<span class="bar-value">' + (opt.money === false ? U.toFa(U.group(it.value)) : U.moneyShort(it.value)) + '</span>';
      list.appendChild(row);
    });
    return list;
  }
  function donut(items, opt) {
    opt = opt || {};
    var total = U.sum(items, function (i) { return i.value; }) || 1;
    var colors = opt.colors || ['var(--primary)', '#2563eb', '#f59e0b', '#8b5cf6', '#ef4444', '#14b8a6', '#ec4899'];
    var r = 54, c = 2 * Math.PI * r, offset = 0;
    var circles = items.map(function (it, i) {
      var frac = it.value / total;
      var seg = '<circle r="' + r + '" cx="80" cy="80" fill="none" stroke="' + (it.color || colors[i % colors.length]) + '" stroke-width="26" ' +
        'stroke-dasharray="' + (frac * c).toFixed(2) + ' ' + c.toFixed(2) + '" stroke-dashoffset="' + (-offset * c).toFixed(2) + '" transform="rotate(-90 80 80)"><title>' + U.esc(it.label) + ': ' + U.percent(frac * 100) + '</title></circle>';
      offset += frac;
      return seg;
    }).join('');
    var box = U.el('div', { class: 'donut-box' });
    box.innerHTML = '<svg viewBox="0 0 160 160" class="donut">' + circles + '</svg>' +
      '<div class="donut-legend">' + items.map(function (it, i) {
        return '<div class="legend-row"><i style="background:' + (it.color || colors[i % colors.length]) + '"></i><span class="grow">' + U.esc(it.label) + '</span><b>' + (opt.money === false ? U.toFa(U.group(it.value)) : U.moneyShort(it.value)) + '</b></div>';
      }).join('') + '</div>';
    return box;
  }

  function printHTML(html, title) {

    doc.open();

      '<style>' + printCSS() + '</style></head><body>' + html + '</body></html>');

      setTimeout(function () { frame.remove(); }, 1500);
    }, 350);
  }

  /* ---------- انتخابگر تصویر + تحلیل هوشمند ---------- */
  function imagePicker(opt) {
    opt = opt || {};
    var state = { dataUrl: opt.value || '', analysis: null, fp: null, prepared: null };
    var box = U.el('div', { class: 'img-picker' });
    var preview = U.el('div', { class: 'img-preview' + (state.dataUrl ? ' has' : '') });
    if (state.dataUrl) preview.innerHTML = '<img src="' + state.dataUrl + '" alt="تصویر جنس">';
    else preview.innerHTML = '<div class="img-empty">' + iconHTML('image', 30) + '<span>عکس جنس را بکشید و رها کنید<br><small>یا کلیک کنید / با دوربین بگیرید / Ctrl+V بچسبانید</small></span></div>';

    var input = U.el('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'hidden' });
    var report = U.el('div', { class: 'ai-report hidden' });
    var actions = U.el('div', { class: 'row gap-sm wrap' });
    var analyzeBtn = U.el('button', {
      class: 'btn btn-primary btn-sm', type: 'button',
      html: iconHTML('sparkles', 16) + ' تحلیل هوشمند تصویر'
    });
    var removeBtn = U.el('button', { class: 'btn btn-ghost btn-sm', type: 'button', html: iconHTML('x', 15) + ' حذف عکس' });
    actions.appendChild(analyzeBtn); actions.appendChild(removeBtn);

    box.appendChild(preview); box.appendChild(input); box.appendChild(actions); box.appendChild(report);

    function setImage(dataUrl) {
      state.dataUrl = dataUrl;
      preview.classList.add('has');
      preview.innerHTML = '<img src="' + dataUrl + '" alt="تصویر جنس">';
      report.classList.add('hidden');
      state.analysis = null;
      if (opt.onImage) opt.onImage(dataUrl, state);
    }
    function handleFile(file) {
      var raw = '';
      U.readImage(file).then(function (f) {
        raw = f.dataUrl;
        return Shop.vision.prepare(f.dataUrl);
      }).then(function (prep) {
        state.prepared = prep;
        setImage(prep.dataUrl || raw);
      }).catch(function (e) { U.toast(e.message, 'err'); });
    }
    preview.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () { if (input.files[0]) handleFile(input.files[0]); });
    removeBtn.addEventListener('click', function () {
      state.dataUrl = ''; state.analysis = null; state.fp = null; state.prepared = null;
      preview.classList.remove('has');
      preview.innerHTML = '<div class="img-empty">' + iconHTML('image', 30) + '<span>عکس جنس را بکشید و رها کنید</span></div>';
      report.classList.add('hidden');
      if (opt.onImage) opt.onImage('', state);
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      preview.addEventListener(ev, function (e) { e.preventDefault(); preview.classList.add('drag'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      preview.addEventListener(ev, function (e) { e.preventDefault(); preview.classList.remove('drag'); });
    });
    preview.addEventListener('drop', function (e) {
      var f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) handleFile(f);
    });
    document.addEventListener('paste', function (e) {
      if (!img_paste_active) return;
      var items = (e.clipboardData || {}).items || [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf('image') === 0) { handleFile(items[i].getAsFile()); break; }
      }
    });
    var img_paste_active = false;
    box.addEventListener('mouseenter', function () { img_paste_active = true; });
    box.addEventListener('mouseleave', function () { img_paste_active = false; });

    analyzeBtn.addEventListener('click', function () {
      if (!state.dataUrl) return U.toast('اول یک عکس انتخاب کنید', 'warn');
      analyzeBtn.disabled = true;
      analyzeBtn.innerHTML = iconHTML('sparkles', 16) + ' در حال تحلیل…';
      Shop.vision.analyze(state.dataUrl, { dict: Shop.store.listCategories() }).then(function (rep) {
        state.analysis = rep;
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = iconHTML('sparkles', 16) + ' تحلیل دوباره';
        if (!rep.ok) {
          report.classList.remove('hidden');
          report.innerHTML = '<div class="alert alert-warn">' + U.esc(rep.error) + '</div>';
          return;
        }
        state.fp = rep.fp;
        renderReport(rep);
        if (opt.onAnalysis) opt.onAnalysis(rep);
        U.toast('تحلیل انجام شد — پیشنهادها را بررسی کنید', 'ok');
      }).catch(function (e) {
        analyzeBtn.disabled = false;
        analyzeBtn.innerHTML = iconHTML('sparkles', 16) + ' تحلیل هوشمند تصویر';
        U.toast('تحلیل تصویر ممکن نشد: ' + e.message, 'err');
      });
    });

    function renderReport(rep) {
      var c = rep.candidates;
      var html = '<div class="ai-head">' + iconHTML('sparkles', 18) + ' تحلیل تصویر (کاملاً روی همین دستگاه — بدون ارسال به اینترنت)</div>';
      html += '<div class="ai-chips">' + c.map(function (x, i) {
        return '<button type="button" class="chip ' + (i === 0 ? 'chip-primary' : '') + '" data-pick="' + x.key + '">' +
          x.icon + ' ' + U.esc(x.name) + ' <b>' + U.percent(x.share * 100, 0) + '</b></button>';
      }).join('') + '</div>';
      if (rep.ambiguous) html += '<div class="alert alert-warn small">تصویر میان چند دسته مشترک است؛ دقیق‌ترین گزینه را انتخاب کنید.</div>';
      html += '<div class="ai-summary">' + U.esc(rep.summary) + '</div>';
      html += '<div class="row gap-sm wrap ai-actions">';
      html += '<button type="button" class="btn btn-primary btn-sm" data-apply="all">' + iconHTML('check', 15) + ' پرکردن خودکار فرم</button>';
      html += '<button type="button" class="btn btn-ghost btn-sm" data-apply="name">فقط نام</button>';
      html += '<button type="button" class="btn btn-ghost btn-sm" data-apply="tags">فقط برچسب‌ها</button>';
      html += '<button type="button" class="btn btn-ghost btn-sm" data-apply="color">فقط رنگ و پالت</button>';
      html += '</div>';
      html += '<div class="palette">' + rep.suggestion.palette.map(function (p) {
        return '<span class="swatch" style="background:' + p.hex + '" title="' + U.esc(p.name) + ' — ' + U.percent(p.pct * 100, 0) + '"></span>';
      }).join('') + '<span class="muted small">رنگ غالب: ' + U.esc(rep.suggestion.colorName) + ' — ' + rep.suggestion.color + '</span></div>';
      if (rep.best.why && rep.best.why.length) {
        html += '<ul class="ai-why">' + rep.best.why.map(function (w) { return '<li>' + U.esc(w) + '</li>'; }).join('') + '</ul>';
      }
      if (rep.warnings.length) {
        html += '<div class="alert alert-warn small">' + rep.warnings.map(function (w) { return '• ' + U.esc(w); }).join('<br>') + '</div>';
      }
      report.innerHTML = html;
      report.classList.remove('hidden');
      U.$$('[data-pick]', report).forEach(function (btn) {
        btn.addEventListener('click', function () {
          var key = btn.getAttribute('data-pick');
          var chosen = rep.candidates.filter(function (x) { return x.key === key; })[0] || rep.best;
          U.$$('[data-pick]', report).forEach(function (b) { b.classList.remove('chip-primary'); });
          btn.classList.add('chip-primary');
          if (opt.onPick) opt.onPick(chosen, rep);
        });
      });
      U.$$('[data-apply]', report).forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (opt.onApply) opt.onApply(btn.getAttribute('data-apply'), rep);
        });
      });
    }

    return {
      el: box, state: state,
      setImage: setImage,
      clear: function () { removeBtn.click(); },
      analyze: function () { analyzeBtn.click(); }
    };
  }

  /* ---------- ماشین‌حساب قیمت (درصدی) ---------- */
  function priceCalc(opt) {
    opt = opt || {};
    var st = {
      cost: U.num(opt.cost || 0),
      price: U.num(opt.price || 0),
      basis: 'price',   /* price | cost */
      rounding: 'none'
    };
    var box = U.el('div', { class: 'calc' });
    var displayLbl = U.el('div', { class: 'calc-lbl', text: 'قیمت فروش' });
    var display = U.el('div', { class: 'calc-display', text: U.money(st.price) });
    var costRow = U.el('div', { class: 'calc-row' });
    costRow.innerHTML = '<label class="lbl">قیمت خرید</label>';
    var costInput = U.el('input', { class: 'input input-sm', inputmode: 'numeric', value: st.price ? '' : '' });
    costRow.appendChild(costInput);

    var pad = U.el('div', { class: 'calc-pad' });
    [['7', '8', '9', '+۵٪'], ['4', '5', '6', '−۵٪'], ['1', '2', '3', '+۱۰٪'], ['0', '۰۰۰', 'C', '−۱۰٪'],
    ['+٪ دلخواه', '−٪ دلخواه', '⌫', '='], ['+۵۰ هزار', '−۵۰ هزار', '+۱۰۰ هزار', 'گرد کن']].forEach(function (row) {
      row.forEach(function (k) {
        var b = U.el('button', { type: 'button', class: 'calc-key', text: k });
        b.addEventListener('click', function () { press(k); });
        pad.appendChild(b);
      });
    });

    var info = U.el('div', { class: 'calc-info' });
    var applyBtn = U.el('button', {
      class: 'btn btn-primary btn-block', type: 'button', html: iconHTML('check', 16) + (opt.applyText || 'اعمال قیمت جدید')
    });
    applyBtn.addEventListener('click', function () {
      if (opt.onApply) opt.onApply(st.price, st);
    });

    var history = U.el('div', { class: 'calc-history' });

    function render() {
      display.textContent = U.money(st.price);
      displayLbl.textContent = (st.basis === 'cost' ? 'قیمت پیشنهادی بر پایه‌ی قیمت خرید' : 'قیمت فروش');
      var m = Shop.store.pricing;
      var margin = m.margin(st.cost, st.price), markup = m.markup(st.cost, st.price);
      info.innerHTML =
        '<div class="calc-line"><span>سود هر واحد</span><b>' + U.toman(st.price - st.cost) + '</b></div>' +
        '<div class="calc-line"><span>حاشیه‌ی سود (Margin)</span><b>' + U.percent(margin) + '</b></div>' +
        '<div class="calc-line"><span>درصد روی خرید (Markup)</span><b>' + U.percent(markup) + '</b></div>' +
        '<div class="calc-line"><span>قیمت خرید</span><b>' + U.toman(st.cost) + '</b></div>' +
        (margin < 0 ? '<div class="alert alert-err small">قیمت فروش از قیمت خرید کمتر است!</div>' :
          margin < 8 && st.cost ? '<div class="alert alert-warn small">حاشیه‌ی سود کمتر از ۸٪ — بازنگری کنید.</div>' : '');
      if (st.rounding !== 'none') info.innerHTML += '<div class="muted small">گرد کردن: ' + U.esc({ up1000: 'به بالا (هزار تومان)', down1000: 'به پایین (هزار تومان)', up500: 'به بالا (۵۰۰ تومان)', up100: 'به بالا (۱۰۰ تومان)' }[st.rounding] || '') + '</div>';
    }
    function press(k) {
      var m = Shop.store.pricing;
      if (/^\d$/.test(k)) { st.price = st.price * 10 + parseInt(k, 10); }
      else if (k === '۰۰۰') { st.price = st.price * 1000; }
      else if (k === 'C') { st.price = 0; }
      else if (k === '⌫') { st.price = Math.floor(st.price / 10); }
      else if (k === '=') { }
      else if (k === '%دلخواه+' || k === '+٪ دلخواه') {
        U.prompt('چند درصد افزایش؟', '10').then(function (v) {
          if (v == null || v === '') return;
          st.price = m.round(st.price * (1 + U.num(v) / 100), st.rounding === 'none' ? 'none' : st.rounding);
          push('افزایش ' + U.percent(U.num(v), 0)); render();
        });
      } else if (k === '−٪ دلخواه') {
        U.prompt('چند درصد کاهش؟', '10').then(function (v) {
          if (v == null || v === '') return;
          st.price = m.round(st.price * (1 - U.num(v) / 100), st.rounding === 'none' ? 'none' : st.rounding);
          push('کاهش ' + U.percent(U.num(v), 0)); render();
        });
      } else if (/^[+−]\d+/.test(k)) {
        if (k.indexOf('٪') > -1) {
          var pct = U.num(k.replace(/[^\d.]/g, ''));
          var sign = k[0] === '−' ? -1 : 1;
          st.price = m.round(st.price * (1 + sign * pct / 100), st.rounding === 'none' ? 'none' : st.rounding);
          push((sign > 0 ? 'افزایش ' : 'کاهش ') + U.percent(pct, 0));
        } else {
          var amt = U.num(k.replace(/[^\d]/g, '')) * 1000;
          var sg = k[0] === '−' ? -1 : 1;
          st.price = Math.max(0, st.price + sg * amt);
          push((sg > 0 ? '+' : '−') + U.moneyShort(amt));
        }
      } else if (k.replace(/[^\d]/g, '') && k.indexOf('گرد') === 0) {
        st.price = m.round(st.price, 'up1000');
        push('گرد به هزار');
      } else if (k.indexOf('حالا') > -1) { st.rounding = 'up1000'; st.price = m.round(st.price, 'up1000'); push('گرد به هزار'); }
      render();
    }
    function push(what) {
      var d = U.el('div', { class: 'calc-hist-row' });
      d.innerHTML = '<span>' + U.esc(what) + '</span><b>' + U.money(st.price) + '</b>';
      history.prepend(d);
      while (history.children.length > 6) history.lastChild.remove();
      if (opt.onChange) opt.onChange(st.price, st);
    }
    costInput.addEventListener('input', function () {
      st.cost = U.num(costInput.value);
      if (st.basis === 'cost' && st.cost) st.price = Shop.store.pricing.round(Shop.store.pricing.fromMarkup(st.cost, Shop.store.db.settings.defaultProfit || 25), st.rounding === 'none' ? 'none' : st.rounding);
      render();
      if (opt.onChange) opt.onChange(st.price, st);
    });

    var roundSel = U.el('select', { class: 'input input-sm' }, [
      U.el('option', { value: 'none', text: 'بدون گرد کردن' }),
      U.el('option', { value: 'up1000', text: 'گرد به بالا (هزار)' }),
      U.el('option', { value: 'down1000', text: 'گرد به پایین (هزار)' }),
      U.el('option', { value: 'up500', text: 'گرد به بالا (۵۰۰)' }),
      U.el('option', { value: 'up100', text: 'گرد به بالا (۱۰۰)' })
    ]);
    roundSel.addEventListener('change', function () { st.rounding = roundSel.value; if (roundSel.value !== 'none') st.price = Shop.store.pricing.round(st.price, roundSel.value); render(); });

    var basisSel = U.el('select', { class: 'input input-sm' }, [
      U.el('option', { value: 'price', text: 'پایه: قیمت فعلی' }),
      U.el('option', { value: 'cost', text: 'پایه: قیمت خرید + سود' })
    ]);
    basisSel.addEventListener('change', function () { st.basis = basisSel.value; render(); });

    box.appendChild(displayLbl); box.appendChild(display);
    box.appendChild(costRow);
    box.appendChild(U.el('div', { class: 'row gap-sm wrap' }, [basisSel, roundSel]));
    box.appendChild(pad);
    box.appendChild(info);
    box.appendChild(applyBtn);
    box.appendChild(history);

    /* پیش‌تنظیم از جنس */
    if (opt.cost) { costInput.value = U.group(opt.cost); }
    if (opt.price) st.price = U.num(opt.price);
    render();

    return { el: box, state: st, setPrice: function (v) { st.price = U.num(v); render(); }, setCost: function (v) { st.cost = U.num(v); costInput.value = U.group(v); render(); } };
  }

  /* ---------- فرم‌ساز ---------- */
  function form(spec) {
    var box = U.el('div', { class: 'form-grid' });
    var fields = {};
    (spec.fields || []).forEach(function (f) {
      var wrap = U.el('div', { class: 'field ' + (f.full ? 'full' : '') + (f.half ? ' half' : '') });
      if (f.type !== 'hidden') {
        var lbl = U.el('label', { class: 'lbl', text: f.label });
        if (f.hint) lbl.innerHTML += ' <span class="hint" title="' + U.attr(f.hint) + '">ⓘ</span>';
        wrap.appendChild(lbl);
      }
      var input;
      if (f.type === 'select') {
        input = U.el('select', { class: 'input' });
        (f.options || []).forEach(function (o) {
          input.appendChild(U.el('option', { value: o.value, text: o.label, selected: String(o.value) === String(f.value) }));
        });
      } else if (f.type === 'textarea') {
        input = U.el('textarea', { class: 'input', rows: f.rows || 2, placeholder: f.placeholder || '' });
        input.value = f.value == null ? '' : f.value;
      } else if (f.type === 'checkbox') {
        input = U.el('label', { class: 'switch' }, [
          U.el('input', { type: 'checkbox', checked: !!f.value }),
          U.el('span', { class: 'slider' }),
          U.el('span', { class: 'switch-lbl', text: f.hint || '' })
        ]);
        input = input;
      } else if (f.type === 'money' || f.type === 'number') {
        input = U.el('input', { class: 'input', inputmode: 'numeric', value: f.value == null ? '' : (f.type === 'money' ? U.group(f.value) : f.value), placeholder: f.placeholder || '' });
        if (f.type === 'money') {
          input.addEventListener('input', U.debounce(function () {
            var caretEnd = input.selectionStart === input.value.length;
            input.value = U.group(U.num(input.value));
            if (caretEnd) input.setSelectionRange(input.value.length, input.value.length);
          }, 350));
        }
      } else if (f.type === 'tags') {
        input = U.el('input', { class: 'input', value: (f.value || []).join('، '), placeholder: f.placeholder || 'با کاما جدا کنید' });
      } else {
        input = U.el('input', { class: 'input', type: f.type || 'text', value: f.value == null ? '' : f.value, placeholder: f.placeholder || '' });
      }
      if (f.type === 'checkbox') fields[f.key] = { el: input, get: function () { return input.querySelector('input').checked; }, set: function (v) { input.querySelector('input').checked = !!v; }, type: f.type };
      else fields[f.key] = {
        el: input, type: f.type, spec: f,
        get: function () {
          if (f.type === 'money' || f.type === 'number') return U.num(input.value);
          if (f.type === 'tags') return String(input.value).split(/[،,]/).map(function (s) { return s.trim(); }).filter(Boolean);
          return input == null ? '' : (input.value == null ? '' : input.value);
        },
        set: function (v) {
          if (f.type === 'money') input.value = U.group(v);
          else if (f.type === 'tags') input.value = (v || []).join('، ');
          else if (f.type === 'select') input.value = v;
          else input.value = v == null ? '' : v;
        }
      };
      wrap.appendChild(input);
      if (f.help) wrap.appendChild(U.el('div', { class: 'muted small', text: f.help }));
      box.appendChild(wrap);
    });
    return {
      el: box, fields: fields,
      values: function () {
        var v = {};
        Object.keys(fields).forEach(function (k) { v[k] = fields[k].get(); });
        return v;
      },
      setValues: function (obj) {
        Object.keys(obj).forEach(function (k) { if (fields[k]) fields[k].set(obj[k]); });
      }
    };
  }
